<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文字足迹</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  </head>
  <body>
    <main class="shell">
      <section id="loginView" class="login-view">
        <div class="login-panel">
          <p class="eyebrow">Private archive</p>
          <h1>文字足迹</h1>
          <form id="loginForm" class="login-form">
            <label for="password">管理员密码</label>
            <div class="password-row">
              <input id="password" name="password" type="password" autocomplete="current-password" required />
              <button class="icon-button filled" type="submit" title="登录" aria-label="登录">
                <i data-lucide="log-in"></i>
              </button>
            </div>
            <p id="loginError" class="error" role="alert"></p>
          </form>
        </div>
      </section>

      <section id="appView" class="app-view hidden">
        <header class="topbar">
          <div>
            <p class="eyebrow">Live shared archive</p>
            <h1>文字足迹</h1>
          </div>
          <button id="logoutButton" class="icon-button" type="button" title="退出登录" aria-label="退出登录">
            <i data-lucide="log-out"></i>
          </button>
        </header>

        <section class="cloud-section">
          <div class="section-heading">
            <h2>全部词云</h2>
            <span id="syncState">实时同步中</span>
          </div>
          <div id="wordCloud" class="word-cloud empty">还没有足迹</div>
        </section>

        <section class="composer-section">
          <form id="footprintForm" class="composer">
            <div class="form-grid">
              <label>
                <span>撰写时间</span>
                <input id="writtenAt" type="datetime-local" required />
              </label>
              <label>
                <span>图片版文字</span>
                <input id="imageInput" type="file" accept="image/*" />
              </label>
            </div>
            <label>
              <span>文字内容</span>
              <textarea id="contentInput" rows="7" placeholder="粘贴文字，或上传图片后等待识别结果"></textarea>
            </label>
            <div id="ocrStatus" class="muted"></div>
            <div id="imagePreview" class="image-preview hidden"></div>
            <div class="actions">
              <button id="ocrButton" class="text-button" type="button">
                <i data-lucide="scan-text"></i>
                识别图片文字
              </button>
              <button class="text-button primary" type="submit">
                <i data-lucide="plus"></i>
                添加足迹
              </button>
            </div>
          </form>
        </section>

        <section class="timeline-section">
          <div class="section-heading">
            <h2>时间足迹</h2>
            <span id="countLabel">0 条</span>
          </div>
          <div id="timeline" class="timeline"></div>
        </section>
      </section>
    </main>

    <template id="footprintTemplate">
      <article class="footprint">
        <div class="marker"></div>
        <div class="footprint-body">
          <div class="footprint-meta">
            <time></time>
            <button class="icon-button danger delete-button" type="button" title="删除" aria-label="删除">
              <i data-lucide="trash-2"></i>
            </button>
          </div>
          <img class="footprint-image" alt="上传的图片文字" />
          <p class="footprint-content"></p>
          <div class="keyword-row"></div>
        </div>
      </article>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
