services:
  - type: web
    name: word-cloud-footprints
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: footprints-data
      mountPath: /var/data
      sizeGB: 1
